[package]
name = "apex-setting-hub"
version = "1.0.0"
description = "A safe Apex Legends settings manager"
authors = ["Apex Setting Hub"]
edition = "2021"

[lib]
name = "apex_setting_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
sysinfo = "0.37"
windows = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
